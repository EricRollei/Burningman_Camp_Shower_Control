<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff" stroke="#cccccc"/>
  <text x="400" y="40" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Control Diagram v1 — PLACEHOLDER</text>
  <text x="400" y="70" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#666">M5Stack Tough + PaHub (I²C) + relays + sensors</text>

  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="330" y="180" width="150" height="70" fill="#eef" stroke="#333"/>
    <text x="405" y="210">M5Stack Tough</text>
    <text x="405" y="230">(controller)</text>

    <rect x="330" y="300" width="150" height="50" fill="#efe" stroke="#333"/>
    <text x="405" y="330">PaHub (I²C)</text>

    <!-- I2C devices -->
    <rect x="60"  y="290" width="140" height="40" fill="#ffe" stroke="#333"/>
    <text x="130" y="315">RFID2 reader</text>
    <rect x="60"  y="350" width="140" height="40" fill="#ffe" stroke="#333"/>
    <text x="130" y="375">4Relay module</text>
    <rect x="60"  y="230" width="140" height="40" fill="#ffe" stroke="#333"/>
    <text x="130" y="255">Keypad / buttons</text>

    <!-- GPIO signals -->
    <rect x="600" y="150" width="150" height="40" fill="#fee" stroke="#333"/>
    <text x="675" y="175">Flow sensor pulse</text>
    <rect x="600" y="200" width="150" height="40" fill="#fee" stroke="#333"/>
    <text x="675" y="225">Shower switch</text>
    <rect x="600" y="250" width="150" height="40" fill="#fee" stroke="#333"/>
    <text x="675" y="275">LED strip data</text>

    <!-- Relay loads -->
    <rect x="600" y="330" width="150" height="40" fill="#efe" stroke="#333"/>
    <text x="675" y="355">Pump / USB-C / LED</text>
  </g>

  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="405" y1="250" x2="405" y2="300"/>
    <line x1="330" y1="325" x2="200" y2="310"/>
    <line x1="330" y1="325" x2="200" y2="370"/>
    <line x1="330" y1="325" x2="200" y2="250"/>
    <line x1="480" y1="200" x2="600" y2="170"/>
    <line x1="480" y1="210" x2="600" y2="220"/>
    <line x1="480" y1="230" x2="600" y2="270"/>
    <line x1="200" y1="370" x2="600" y2="350"/>
  </g>

  <text x="400" y="430" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#999">Replace with real control schematic. See SoftwareSpec.md.</text>
</svg>

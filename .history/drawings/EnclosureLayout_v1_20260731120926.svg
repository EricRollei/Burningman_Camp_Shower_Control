<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff" stroke="#cccccc"/>
  <text x="400" y="40" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Enclosure Layout v1 — PLACEHOLDER</text>
  <text x="400" y="70" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#666">Component placement + plumbing path</text>

  <!-- enclosure box -->
  <rect x="60" y="100" width="680" height="300" fill="#fafafa" stroke="#333" stroke-dasharray="6 4"/>

  <g font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="90"  y="130" width="120" height="50" fill="#eef" stroke="#333"/>
    <text x="150" y="160">Breaker + Fuses</text>

    <rect x="90"  y="210" width="120" height="50" fill="#eef" stroke="#333"/>
    <text x="150" y="240">Controller</text>

    <rect x="90"  y="290" width="120" height="50" fill="#eef" stroke="#333"/>
    <text x="150" y="320">PaHub + Relays</text>

    <rect x="300" y="130" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="360" y="160">Filter</text>
    <rect x="300" y="210" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="360" y="240">Pump</text>
    <rect x="300" y="290" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="360" y="320">Accumulator</text>

    <rect x="500" y="130" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="560" y="160">Water heater</text>
    <rect x="500" y="210" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="560" y="240">Mixing valve</text>
    <rect x="500" y="290" width="120" height="50" fill="#def" stroke="#333"/>
    <text x="560" y="320">Flow sensor</text>

    <rect x="650" y="210" width="80" height="50" fill="#efe" stroke="#333"/>
    <text x="690" y="240">Shower</text>
  </g>

  <g stroke="#0077aa" stroke-width="2" fill="none">
    <line x1="360" y1="180" x2="360" y2="210"/>
    <line x1="360" y1="260" x2="360" y2="290"/>
    <line x1="420" y1="315" x2="560" y2="180"/>
    <line x1="560" y1="180" x2="560" y2="210"/>
    <line x1="560" y1="260" x2="560" y2="290"/>
    <line x1="620" y1="315" x2="690" y2="260"/>
  </g>

  <text x="400" y="430" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#999">Replace with real layout. See Assembly.md and Plumbing.md.</text>
</svg>

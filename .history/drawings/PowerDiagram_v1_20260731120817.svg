<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff" stroke="#cccccc"/>
  <text x="400" y="40" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">Power Diagram v1 — PLACEHOLDER</text>
  <text x="400" y="70" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#666">Burning Man Shower Controller — 12V system (one per shower)</text>

  <!-- Simple block flow: Battery -> Breaker -> Fuse block -> loads -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="40"  y="180" width="130" height="60" fill="#eef" stroke="#333"/>
    <text x="105" y="215">Battery 12.8V 40Ah</text>

    <rect x="220" y="180" width="130" height="60" fill="#eef" stroke="#333"/>
    <text x="285" y="207">30A Breaker</text>
    <text x="285" y="225">(main disconnect)</text>

    <rect x="400" y="180" width="130" height="60" fill="#eef" stroke="#333"/>
    <text x="465" y="207">Fuse Block</text>
    <text x="465" y="225">(+ neg bus)</text>

    <rect x="600" y="60"  width="160" height="40" fill="#efe" stroke="#333"/>
    <text x="680" y="85">Pump (15A)</text>
    <rect x="600" y="120" width="160" height="40" fill="#efe" stroke="#333"/>
    <text x="680" y="145">USB-C conv (5A)</text>
    <rect x="600" y="180" width="160" height="40" fill="#efe" stroke="#333"/>
    <text x="680" y="205">LED strip</text>
    <rect x="600" y="240" width="160" height="40" fill="#efe" stroke="#333"/>
    <text x="680" y="265">Controller (3-5A)</text>
    <rect x="600" y="300" width="160" height="40" fill="#efe" stroke="#333"/>
    <text x="680" y="325">Utility lights (10A)</text>

    <!-- Charging inputs -->
    <rect x="40"  y="300" width="130" height="40" fill="#ffe" stroke="#333"/>
    <text x="105" y="325">Solar 50W</text>
    <rect x="40"  y="360" width="130" height="40" fill="#ffe" stroke="#333"/>
    <text x="105" y="385">AC charger 10A</text>
  </g>

  <!-- connectors -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="170" y1="210" x2="220" y2="210"/>
    <line x1="350" y1="210" x2="400" y2="210"/>
    <line x1="530" y1="210" x2="600" y2="80"/>
    <line x1="530" y1="210" x2="600" y2="140"/>
    <line x1="530" y1="210" x2="600" y2="200"/>
    <line x1="530" y1="210" x2="600" y2="260"/>
    <line x1="530" y1="210" x2="600" y2="320"/>
    <line x1="105" y1="300" x2="105" y2="240"/>
    <line x1="170" y1="380" x2="105" y2="300"/>
  </g>

  <text x="400" y="430" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#999">Replace with real schematic. See Wiring.md.</text>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Audio Batch</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #11130f; color: #f1f3e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 0, #36431e 0, transparent 34rem), #11130f; }
    main { width: min(980px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 4.2rem); letter-spacing: -.06em; }
    .lede { color: #b9bea9; margin: 0 0 30px; }
    .panel { background: #1b1e18e8; border: 1px solid #3a4031; border-radius: 18px; padding: 20px; box-shadow: 0 20px 70px #0008; }
    textarea, input { width: 100%; color: inherit; background: #11130f; border: 1px solid #454b3c; border-radius: 9px; padding: 11px 12px; font: inherit; }
    textarea { min-height: 118px; resize: vertical; }
    textarea:focus, input:focus { outline: 2px solid #c5ef55; outline-offset: 1px; }
    .hint { color: #939a83; font-size: .84rem; margin: 8px 0 14px; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; font: 650 inherit; cursor: pointer; color: #161a0f; background: #c5ef55; }
    button.secondary { color: #dfe5d1; background: #343a2c; }
    button.remove { color: #c7ccbb; background: transparent; padding: 8px; }
    button:disabled { cursor: wait; opacity: .55; }
    .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 18px; }
    .actions > div { display: flex; gap: 10px; }
    .queue { display: grid; gap: 9px; margin-top: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1.55fr 42px; gap: 9px; align-items: center; }
    .row.status-downloaded input { border-color: #77b82a; }
    .row.status-skipped input { border-color: #b69f3c; }
    .row.status-error input { border-color: #d45c55; }
    .item-status { display: none; grid-column: 1 / -1; padding: 1px 4px 7px; color: #aeb5a1; font-size: .84rem; overflow-wrap: anywhere; }
    .row.status-downloaded .item-status { display: block; color: #9dcc61; }
    .row.status-skipped .item-status { display: block; color: #d2bc62; }
    .row.status-error .item-status { display: block; color: #ed817a; }
    #summary { min-height: 1.5em; margin-top: 16px; color: #d7dcca; }
    .history { margin-top: 28px; }
    .history h2 { font-size: 1rem; color: #afb69d; }
    #history { color: #929985; font-size: .88rem; display: grid; gap: 5px; }
    @media (max-width: 700px) { main { margin-top: 24px; } .row { grid-template-columns: 1fr 38px; } .row .url { grid-column: 1; grid-row: 2; } .row .remove { grid-column: 2; grid-row: 1 / 3; } .actions { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>YouTube → MP3</h1>
    <p class="lede">Name tracks, batch-download them, and quietly skip anything already fetched.</p>
    <section class="panel">
      <textarea id="paste" placeholder="Paste one URL per line…&#10;or: Custom track name | https://youtu.be/…"></textarea>
      <p class="hint">Use <strong>Name | URL</strong> to prefill names, or edit names in the queue below.</p>
      <button id="add">Add to queue</button>
      <div id="queue" class="queue"></div>
      <div class="actions">
        <button id="newRow" class="secondary">+ Empty row</button>
        <div><button id="clear" class="secondary">Clear</button><button id="download">Download batch</button></div>
      </div>
      <div id="summary"></div>
      <div class="history">
        <h2>Recent downloads</h2>
        <div id="history">None yet.</div>
      </div>
    </section>
  </main>
  <script>
    const queue = document.querySelector('#queue');
    const paste = document.querySelector('#paste');
    const summary = document.querySelector('#summary');

    function addRow(name = '', url = '') {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<input class="name" aria-label="MP3 name" placeholder="MP3 name (optional)"><input class="url" aria-label="YouTube URL" placeholder="https://youtube.com/watch?v=…"><button class="remove" title="Remove" aria-label="Remove">×</button><div class="item-status" role="status"></div>';
      row.querySelector('.name').value = name;
      row.querySelector('.url').value = url;
      row.querySelector('.remove').onclick = () => row.remove();
      queue.append(row);
    }

    function addPasted() {
      const lines = paste.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      for (const line of lines) {
        const separator = line.indexOf('|');
        if (separator < 0) addRow('', line);
        else addRow(line.slice(0, separator).trim(), line.slice(separator + 1).trim());
      }
      paste.value = '';
      if (lines.length) queue.lastElementChild?.querySelector('.name').focus();
    }

    async function loadHistory() {
      try {
        const response = await fetch('/api/history');
        const data = await response.json();
        const entries = (data.downloads || []).slice(0, 8);
        const history = document.querySelector('#history');
        history.replaceChildren();
        if (!entries.length) { history.textContent = 'None yet.'; return; }
        for (const entry of entries) {
          const item = document.createElement('div');
          item.textContent = entry.filename;
          history.append(item);
        }
      } catch { document.querySelector('#history').textContent = 'History unavailable.'; }
    }

    document.querySelector('#add').onclick = addPasted;
    document.querySelector('#newRow').onclick = () => addRow();
    document.querySelector('#clear').onclick = () => { queue.replaceChildren(); summary.textContent = ''; };
    paste.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') addPasted(); });
    document.querySelector('#download').onclick = async event => {
      const downloadButton = event.currentTarget;
      const rows = [...queue.querySelectorAll('.row')];
      const activeRows = rows.filter(row => row.querySelector('.url').value.trim());
      if (!activeRows.length) { summary.textContent = 'Add at least one URL first.'; return; }
      const items = activeRows.map(row => ({ name: row.querySelector('.name').value, url: row.querySelector('.url').value }));
      downloadButton.disabled = true;
      summary.textContent = `Working on ${items.length} track${items.length === 1 ? '' : 's'}… keep this tab open.`;
      rows.forEach(row => {
        row.className = 'row';
        row.querySelector('.item-status').textContent = '';
      });
      try {
        const response = await fetch('/api/download', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        const counts = { downloaded: 0, skipped: 0, error: 0 };
        data.results.forEach((result, index) => {
          counts[result.status]++;
          activeRows[index].classList.add(`status-${result.status}`);
          activeRows[index].title = result.message;
          const detail = result.filename ? `${result.message}: ${result.filename}` : result.message;
          activeRows[index].querySelector('.item-status').textContent = detail;
        });
        summary.textContent = `${counts.downloaded} downloaded · ${counts.skipped} skipped · ${counts.error} failed`;
        loadHistory();
      } catch (error) { summary.textContent = `Error: ${error.message}`; }
      finally { downloadButton.disabled = false; }
    };

    addRow();
    loadHistory();
  </script>
</body>
</html>

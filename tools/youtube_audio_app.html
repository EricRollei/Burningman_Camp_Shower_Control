<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp Audio Library</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #10120e;
      color: #f1f3e9;
      --panel: #1b1e18e8;
      --line: #3a4031;
      --muted: #a6ad98;
      --accent: #c5ef55;
      --danger: #ed817a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 0, #36431e 0, transparent 34rem), #10120e; }
    main { width: min(1120px, calc(100% - 32px)); margin: 42px auto 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0 0 6px; font-size: clamp(2.2rem, 6vw, 4.5rem); letter-spacing: -.06em; line-height: .95; }
    h2 { margin: 0; font-size: 1.25rem; }
    .lede, .muted { color: var(--muted); }
    .lede { margin: 0; }
    .stats { display: flex; gap: 9px; }
    .stat { min-width: 92px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 13px; background: #171a14cc; }
    .stat strong { display: block; color: var(--accent); font-size: 1.35rem; }
    .stat span { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(330px, .85fr); gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 20px 70px #0007; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .count { color: var(--muted); font-size: .88rem; white-space: nowrap; }
    textarea, input { width: 100%; color: inherit; background: #11130f; border: 1px solid #454b3c; border-radius: 9px; padding: 11px 12px; font: inherit; }
    textarea { min-height: 98px; resize: vertical; }
    textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; font: 650 inherit; cursor: pointer; color: #161a0f; background: var(--accent); }
    button.secondary { color: #dfe5d1; background: #343a2c; }
    button.ghost { color: #c7ccbb; background: transparent; padding: 7px; }
    button.danger:hover { color: var(--danger); }
    button:disabled { cursor: wait; opacity: .55; }
    .hint { color: #939a83; font-size: .82rem; margin: 7px 0 13px; }
    .composer-actions, .bulk-actions { display: flex; gap: 9px; justify-content: space-between; align-items: center; }
    .bulk-actions { margin-top: 15px; }
    .list { display: grid; gap: 8px; }
    .wishlist-list { margin-top: 20px; }
    .wish { display: grid; grid-template-columns: 24px 1fr 36px; align-items: center; gap: 8px; padding: 10px; border: 1px solid #363c2f; border-radius: 11px; background: #131610; }
    .wish input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
    .wish-main { min-width: 0; }
    .wish-name { width: 100%; padding: 6px 8px; border: 0; background: transparent; font-weight: 650; }
    .wish-url { display: block; color: #89927c; font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
    .library-tools { display: flex; gap: 8px; margin-bottom: 13px; }
    .track { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px; border-bottom: 1px solid #30352a; }
    .track:last-child { border-bottom: 0; }
    .icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: #2e3622; color: var(--accent); }
    .track-name { font-weight: 650; overflow-wrap: anywhere; }
    .track-path { color: #8e9682; font-size: .75rem; overflow-wrap: anywhere; }
    .badge { color: #9ca58e; border: 1px solid #414839; border-radius: 99px; padding: 4px 7px; font-size: .7rem; }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); border: 1px dashed #414839; border-radius: 11px; }
    #status { min-height: 1.4em; margin-top: 12px; font-size: .88rem; color: #d7dcca; }
    #status.error { color: var(--danger); }
    @media (max-width: 820px) { header { align-items: start; flex-direction: column; } .layout { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { main { margin-top: 24px; } .stats { width: 100%; } .stat { flex: 1; min-width: 0; } .composer-actions, .bulk-actions { align-items: stretch; flex-direction: column; } .composer-actions button, .bulk-actions button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Camp Audio</h1>
        <p class="lede">Build the playlist now. Bring the noise later.</p>
      </div>
      <div class="stats" aria-label="Audio totals">
        <div class="stat"><strong id="downloadCount">—</strong><span>Downloaded</span></div>
        <div class="stat"><strong id="wishCount">—</strong><span>Wishlist</span></div>
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Download wishlist</h2>
          <span id="wishlistLabel" class="count">Loading…</span>
        </div>
        <textarea id="paste" placeholder="Paste one YouTube URL per line…&#10;or: Custom track name | https://youtu.be/…"></textarea>
        <p class="hint">Use <strong>Name | URL</strong> to set a filename. Your wishlist is saved locally when you add, rename, or remove a track.</p>
        <div class="composer-actions">
          <button id="add">Add to wishlist</button>
        </div>
        <div id="wishlist" class="list wishlist-list"></div>
        <div class="bulk-actions">
          <span class="hint" style="margin:0"><span id="selectedCount">0</span> selected</span>
          <button id="download">Download selected</button>
        </div>
        <div id="status" role="status"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Downloaded audio</h2>
          <span id="libraryLabel" class="count">Loading…</span>
        </div>
        <div class="library-tools"><input id="search" type="search" placeholder="Filter audio…" aria-label="Filter downloaded audio"></div>
        <div id="library" class="list"><div class="empty">Scanning audio folder…</div></div>
      </section>
    </div>
  </main>

  <script>
    const paste = document.querySelector('#paste');
    const wishlist = document.querySelector('#wishlist');
    const library = document.querySelector('#library');
    const status = document.querySelector('#status');
    let wishItems = [];
    let tracks = [];
    let saveTimer;

    function setStatus(message = '', isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function wishPayload() {
      return [...wishlist.querySelectorAll('.wish')].map(row => ({
        name: row.querySelector('.wish-name').value.trim(),
        url: row.dataset.url
      }));
    }

    async function saveWishlist(showConfirmation = false) {
      clearTimeout(saveTimer);
      try {
        const data = await api('/api/wishlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: wishPayload() })
        });
        wishItems = data.items;
        updateCounts();
        if (showConfirmation) setStatus('Wishlist saved.');
      } catch (error) { setStatus(`Could not save wishlist: ${error.message}`, true); }
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveWishlist(), 450);
    }

    function addWishRow(item, checked = true) {
      const row = document.createElement('div');
      row.className = 'wish';
      row.dataset.url = item.url;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = checked;
      checkbox.setAttribute('aria-label', 'Select for download');
      checkbox.addEventListener('change', updateSelection);

      const main = document.createElement('div');
      main.className = 'wish-main';
      const name = document.createElement('input');
      name.className = 'wish-name';
      name.placeholder = 'MP3 name (optional)';
      name.value = item.name || '';
      name.addEventListener('input', scheduleSave);
      const url = document.createElement('span');
      url.className = 'wish-url';
      url.textContent = item.url;
      url.title = item.url;
      main.append(name, url);

      const remove = document.createElement('button');
      remove.className = 'ghost danger';
      remove.type = 'button';
      remove.textContent = '×';
      remove.title = 'Remove from wishlist';
      remove.setAttribute('aria-label', 'Remove from wishlist');
      remove.onclick = async () => { row.remove(); updateSelection(); await saveWishlist(); };
      row.append(checkbox, main, remove);
      wishlist.append(row);
    }

    function renderWishlist() {
      wishlist.replaceChildren();
      if (!wishItems.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Your wishlist is empty. Add some YouTube links above.';
        wishlist.append(empty);
      } else {
        wishItems.forEach(item => addWishRow(item));
      }
      updateSelection();
    }

    function updateCounts() {
      document.querySelector('#wishCount').textContent = wishItems.length;
      document.querySelector('#downloadCount').textContent = tracks.length;
      document.querySelector('#wishlistLabel').textContent = `${wishItems.length} waiting`;
      document.querySelector('#libraryLabel').textContent = `${tracks.length} file${tracks.length === 1 ? '' : 's'}`;
    }

    function updateSelection() {
      const selected = wishlist.querySelectorAll('.wish input[type="checkbox"]:checked').length;
      document.querySelector('#selectedCount').textContent = selected;
      document.querySelector('#download').disabled = selected === 0;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      const units = ['KB', 'MB', 'GB'];
      let value = bytes / 1024;
      let unit = units[0];
      for (let index = 1; value >= 1024 && index < units.length; index++) { value /= 1024; unit = units[index]; }
      return `${value.toFixed(value >= 10 ? 0 : 1)} ${unit}`;
    }

    function renderLibrary() {
      const query = document.querySelector('#search').value.trim().toLowerCase();
      const visible = tracks.filter(track => `${track.name} ${track.path}`.toLowerCase().includes(query));
      library.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = tracks.length ? 'No audio matches that filter.' : 'No audio files downloaded yet.';
        library.append(empty);
        return;
      }
      for (const track of visible) {
        const row = document.createElement('div');
        row.className = 'track';
        const icon = document.createElement('div');
        icon.className = 'icon';
        icon.textContent = '♪';
        const details = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'track-name';
        name.textContent = track.name;
        const meta = document.createElement('div');
        meta.className = 'track-path';
        meta.textContent = `${track.path} · ${formatBytes(track.size_bytes)}`;
        details.append(name, meta);
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = track.format;
        row.append(icon, details, badge);
        library.append(row);
      }
    }

    async function loadAll() {
      try {
        const [wishData, libraryData] = await Promise.all([api('/api/wishlist'), api('/api/library')]);
        wishItems = wishData.items || [];
        tracks = libraryData.tracks || [];
        renderWishlist();
        renderLibrary();
        updateCounts();
      } catch (error) { setStatus(`Could not load audio data: ${error.message}`, true); }
    }

    async function addPasted() {
      const lines = paste.value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) { setStatus('Paste at least one YouTube URL first.', true); return; }
      const existing = wishPayload();
      for (const line of lines) {
        const separator = line.indexOf('|');
        existing.push(separator < 0
          ? { name: '', url: line }
          : { name: line.slice(0, separator).trim(), url: line.slice(separator + 1).trim() });
      }
      try {
        const data = await api('/api/wishlist', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: existing })
        });
        wishItems = data.items;
        paste.value = '';
        renderWishlist();
        updateCounts();
        setStatus(`${lines.length} item${lines.length === 1 ? '' : 's'} added to your wishlist.`);
      } catch (error) { setStatus(`Could not add to wishlist: ${error.message}`, true); }
    }

    document.querySelector('#add').onclick = addPasted;
    document.querySelector('#search').addEventListener('input', renderLibrary);
    paste.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') addPasted(); });
    document.querySelector('#download').onclick = async event => {
      const button = event.currentTarget;
      const selectedRows = [...wishlist.querySelectorAll('.wish')].filter(row => row.querySelector('input[type="checkbox"]').checked);
      const items = selectedRows.map(row => ({ name: row.querySelector('.wish-name').value, url: row.dataset.url }));
      if (!items.length) return;
      await saveWishlist();
      button.disabled = true;
      setStatus(`Downloading ${items.length} track${items.length === 1 ? '' : 's'}… keep this tab open.`);
      try {
        const data = await api('/api/download', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items })
        });
        const counts = { downloaded: 0, skipped: 0, error: 0 };
        data.results.forEach(result => counts[result.status]++);
        const failedUrls = new Set(data.results.filter(result => result.status === 'error').map(result => result.url));
        const remaining = wishPayload().filter(item => !items.some(selected => selected.url === item.url) || failedUrls.has(item.url));
        const saved = await api('/api/wishlist', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: remaining })
        });
        wishItems = saved.items;
        const libraryData = await api('/api/library');
        tracks = libraryData.tracks || [];
        renderWishlist(); renderLibrary(); updateCounts();
        setStatus(`${counts.downloaded} downloaded · ${counts.skipped} already present · ${counts.error} failed`, counts.error > 0);
      } catch (error) { setStatus(`Download failed: ${error.message}`, true); }
      finally { button.disabled = false; updateSelection(); }
    };

    loadAll();
  </script>
</body>
</html>

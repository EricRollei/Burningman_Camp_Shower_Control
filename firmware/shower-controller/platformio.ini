; One firmware, four station images. Pick the station with `-e`:
;   pio run -e shower1      (default)
;   pio run -e shower2
;   pio run -e water_fill
;   pio run -e rv_fill
; STATION_ID / STATION_ROLE are the only per-station differences; names, SSIDs
; and feature gating derive from them in include/Config.h.

[platformio]
default_envs = shower1

[tough]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
platform_packages =
    tool-esptoolpy @ file:///Users/coltonkirsten/.platformio/tools/tool-esptoolpy

upload_speed = 460800
monitor_speed = 115200
upload_port = /dev/cu.usbserial-53190105011
monitor_port = /dev/cu.usbserial-53190105011

monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -I../shared

lib_deps =
    m5stack/M5Unified@0.2.19
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.4
    fastled/FastLED@^3.7.8

[env:shower1]
extends = tough
build_flags = ${tough.build_flags} -DSTATION_ID=1 -DSTATION_ROLE=0

[env:shower2]
extends = tough
build_flags = ${tough.build_flags} -DSTATION_ID=2 -DSTATION_ROLE=0

[env:water_fill]
extends = tough
build_flags = ${tough.build_flags} -DSTATION_ID=3 -DSTATION_ROLE=1

[env:rv_fill]
extends = tough
build_flags = ${tough.build_flags} -DSTATION_ID=4 -DSTATION_ROLE=2

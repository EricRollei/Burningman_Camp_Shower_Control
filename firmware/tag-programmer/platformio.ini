[platformio]
default_envs = tough

[env:tough]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
platform_packages =
    tool-esptoolpy @ file:///Users/coltonkirsten/.platformio/tools/tool-esptoolpy

upload_speed = 460800
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -I../shower-controller/include

lib_deps =
    m5stack/M5Unified@0.2.19

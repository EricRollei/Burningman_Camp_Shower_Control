; One image per door sign. DOOR_STATION_ID must match the STATION_ID of the
; shower Tough this sign is mounted on:
;   pio run -e door1   (Shower 1)
;   pio run -e door2   (Shower 2)

[platformio]
default_envs = door1

[nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I../shared
lib_deps =
    m5stack/M5GFX@0.2.19

[env:door1]
extends = nanoc6
build_flags = ${nanoc6.build_flags} -DDOOR_STATION_ID=1

[env:door2]
extends = nanoc6
build_flags = ${nanoc6.build_flags} -DDOOR_STATION_ID=2
